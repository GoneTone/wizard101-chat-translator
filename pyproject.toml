[project]
name = "wizard101-chat-translator"
version = "0.1.0"
description = "Wizard101 Chat Translator — an AI translator for Wizard101's in-game chat, translating conversations both ways in real time."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "httpx",
    "keyboard",
    "pywin32",
    "wizwalker",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.6",
]

[tool.uv]
package = false  # 從原始碼跑(python -m src.main),不需建置安裝本專案

[tool.uv.sources]
# 收訊靠 wizwalker 掛入遊戲、讀聊天顯示控件。須用有跟進最新 client pattern 的
# LaurenzNotHere fork(官方 PyPI 版 pattern 過舊,對不上現行 client)。
wizwalker = { git = "https://codeberg.org/LaurenzNotHere/wizwalker.git", branch = "development" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# 4 個 worker 平行跑：測試幾乎都在開 tkinter 視窗，平行後約 45 秒→30 秒。
# -n auto 會開太多 Tk 程序（實測有失敗與卡住），固定 4 個；要序列跑加 -n 0
# （不是 -p no:xdist——那會讓這裡的 -n 沒人解析而直接報錯）。
# CI 一律序列跑：runner 上四個程序搶同一個桌面的前景與 grab，Tk 會在 destroy 時
# access violation，見 .github/workflows/ci.yml 的說明。
addopts = "-n 4"
markers = [
    "real_position: 測試斷言視窗的實際位置，不套用 conftest 的螢幕外停放",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/W：pycodestyle；F：pyflakes（未用 import、未定義名稱）；I：import 排序；
# B：常見 bug 模式；UP：舊語法升級；SIM：可簡化的寫法
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# SIM105：try/except pass 比 contextlib.suppress 直白，保留
ignore = ["SIM105"]

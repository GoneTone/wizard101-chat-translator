<meta charset="utf-8">
<title>Wizard101 Chat Translator — social preview (Open Graph)</title>
<style>
  /* GitHub 社群預覽圖（Open Graph），版面直接以建議尺寸 1280×640 撰寫；改動後請以同尺寸視窗
     重新截圖成 og.png。 */
  :root {
    --bg: #101018;
    --fg-title: #f2f2f7;
    --fg-tagline: #c0c0cd;
    --accent: #6fa8ff;
  }

  html, body { margin: 0; padding: 0; background: var(--bg); }

  .banner {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }

  /* 螺旋紋理：以圖示為圓心的同心環，呼應 icon 的漩渦與遊戲的 Spiral 世界觀 */
  .banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 50%, rgba(111, 168, 255, .10), transparent 42%),
      radial-gradient(circle at 24% 50%, rgba(214, 68, 68, .07), transparent 26%),
      repeating-radial-gradient(circle at 30% 50%,
        transparent 0 40px, rgba(200, 200, 216, .038) 40px 42px);
    -webkit-mask-image: radial-gradient(circle at 30% 50%, #000 0%, transparent 72%);
    mask-image: radial-gradient(circle at 30% 50%, #000 0%, transparent 72%);
  }

  .content {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 52px;
  }

  .icon {
    /* 160px 仍在原始 128px 圖檔放大 1.5 倍的上限內：再大「文 A」的邊緣就開始糊 */
    width: 160px;
    height: 160px;
    /* 不加 border-radius：圖示本身已帶圓角與去背，再裁一次會切掉邊角 */
    filter: drop-shadow(0 8px 22px rgba(0, 0, 0, .55));
  }

  .title {
    margin: 0;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--fg-title);
    line-height: 1.05;
  }

  .rule {
    width: 96px;
    height: 3px;
    margin: 18px 0 16px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), rgba(111, 168, 255, 0));
  }

  .tagline {
    margin: 0;
    font-size: 25px;
    font-weight: 400;
    color: var(--fg-tagline);
    letter-spacing: .2px;
  }

  /* 雙向翻譯意象，壓在右下角當背景層次，不與文字爭視線 */
  .arrows {
    position: absolute;
    right: 72px;
    bottom: 32px;
    font-size: 96px;
    line-height: 1;
    color: var(--accent);
    opacity: .06;
  }
</style>

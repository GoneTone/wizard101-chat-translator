[package]
name = "wizard101-chat-translator"
version = "0.6.0"
edition = "2024"

[[bin]]
name = "Wizard101ChatTranslator"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = { version = "1", features = ["preserve_order"] }

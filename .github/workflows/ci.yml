name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 版本與元件（clippy、rustfmt）由 rust-toolchain.toml 決定
      - name: Setup Rust toolchain
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # 測試用 kittest 的離屏 UI，不開可見視窗，所以可以平行跑
      - name: Test
        run: cargo test --locked

      # 效能門檻只在 release 下有意義，平常的 cargo test 把它標成 ignored
      - name: Relayout budget
        run: cargo test --locked --release --lib -- --ignored relayout

      - name: Build exe
        run: cargo build --release --locked

      - name: Verify exe resources
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          .github/scripts/verify-exe.ps1 -Exe target/release/Wizard101ChatTranslator.exe -Version $version

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: target/release/Wizard101ChatTranslator.exe
          retention-days: 14
          if-no-files-found: error

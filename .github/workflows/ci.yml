name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 版本與元件（clippy、rustfmt）由 rust-toolchain.toml 決定
      - name: Setup Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # 測試用 kittest 的離屏 UI，不開可見視窗，所以可以平行跑
      - name: Test
        run: cargo test

      # 效能門檻只在 release 下有意義，平常的 cargo test 把它標成 ignored
      - name: Relayout budget
        run: cargo test --release -- --ignored relayout

      - name: Build exe
        run: cargo build --release

      - name: Verify exe resources
        shell: pwsh
        run: |
          $exe = Get-Item target\release\Wizard101ChatTranslator.exe -ErrorAction Stop
          $version = ((Get-Content Cargo.toml) | Where-Object { $_ -match '^version = "([^"]*)"' } | Select-Object -First 1) -replace '^version = "([^"]*)".*', '$1'
          $info = $exe.VersionInfo
          $expected = [ordered]@{
            ProductName      = 'Wizard101 Chat Translator'
            FileDescription  = 'Wizard101 Chat Translator'
            OriginalFilename = 'Wizard101ChatTranslator.exe'
            ProductVersion   = $version
          }
          foreach ($key in $expected.Keys) {
            $actual = $info.$key
            Write-Host "$key = '$actual' (expected '$($expected[$key])')"
            if ($actual -ne $expected[$key]) { throw "exe $key mismatch: '$actual' vs '$($expected[$key])'" }
          }

          Add-Type -AssemblyName System.Drawing
          if (-not [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)) { throw "exe has no icon resource" }

          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $text = [System.Text.Encoding]::Latin1.GetString($bytes)
          if (-not $text.Contains('PerMonitorV2')) { throw "exe manifest lacks PerMonitorV2" }
          Write-Host "exe resources OK (version $version)"

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: target/release/Wizard101ChatTranslator.exe
          retention-days: 14
          if-no-files-found: error
